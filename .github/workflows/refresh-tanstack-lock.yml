name: Refresh TanStack security lock

on:
  push:
    branches:
      - security/tanstack-start-patch

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[lock-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade TanStack Start to patched release set
        run: npm install --ignore-scripts --save-exact @tanstack/react-start@1.168.60 @tanstack/react-router@1.170.41 @tanstack/router-plugin@1.168.42
      - name: Verify patched versions
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json')
          const packages = lock.packages || {}
          const expected = {
            '@tanstack/react-start': '1.168.60',
            '@tanstack/start-server-core': '1.169.39',
          }
          for (const [name, minimum] of Object.entries(expected)) {
            const actual = packages[`node_modules/${name}`]?.version
            if (!actual) throw new Error(`${name} missing from lockfile`)
            const a = actual.split('.').map(Number)
            const b = minimum.split('.').map(Number)
            const ok = a[0] > b[0] || (a[0] === b[0] && (a[1] > b[1] || (a[1] === b[1] && a[2] >= b[2])))
            if (!ok) throw new Error(`${name} ${actual} is below patched minimum ${minimum}`)
            console.log(`${name}: ${actual}`)
          }
          NODE
      - name: Commit refreshed manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already patched"
            exit 0
          fi
          git commit -m "[lock-refresh] Patch TanStack Start security release"
          git push
